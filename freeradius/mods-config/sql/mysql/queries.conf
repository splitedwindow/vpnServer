# FreeRADIUS MySQL queries configuration
# Compatible with FreeRADIUS 3.x

# Authorization queries
authorize_check_query = "\
	SELECT id, username, attribute, value, op \
	FROM ${authcheck_table} \
	WHERE username = '%{User-Name}' \
	ORDER BY id"

authorize_reply_query = "\
	SELECT id, username, attribute, value, op \
	FROM ${authreply_table} \
	WHERE username = '%{User-Name}' \
	ORDER BY id"

authorize_group_check_query = "\
	SELECT id, groupname, attribute, value, op \
	FROM ${groupcheck_table} \
	WHERE groupname = '%{${group_attribute}}' \
	ORDER BY id"

authorize_group_reply_query = "\
	SELECT id, groupname, attribute, value, op \
	FROM ${groupreply_table} \
	WHERE groupname = '%{${group_attribute}}' \
	ORDER BY id"

group_membership_query = "\
	SELECT groupname \
	FROM ${usergroup_table} \
	WHERE username = '%{User-Name}' \
	ORDER BY priority"

# Subscription check query (checks if user has active subscription)
# Stores expiration as Expiration attribute in radcheck table
# The built-in 'expiration' module in sites-available/default handles this automatically

# Simultaneous-Use queries
simul_count_query = "\
	SELECT COUNT(*) \
	FROM ${acct_table1} \
	WHERE username = '%{User-Name}' \
	AND acctstoptime IS NULL"

simul_verify_query = "\
	SELECT radacctid, acctsessionid, username, nasipaddress, \
		nasportid, framedipaddress, callingstationid, framedprotocol \
	FROM ${acct_table1} \
	WHERE username = '%{User-Name}' \
	AND acctstoptime IS NULL"

# Accounting queries
accounting_onoff_query = "\
	UPDATE ${acct_table1} \
	SET \
		acctstoptime = FROM_UNIXTIME(%{integer:Event-Timestamp}), \
		acctsessiontime = '%{integer:Event-Timestamp}' - UNIX_TIMESTAMP(acctstarttime), \
		acctterminatecause = '%{Acct-Terminate-Cause}', \
		acctupdatetime = FROM_UNIXTIME(%{integer:Event-Timestamp}) \
	WHERE acctstoptime IS NULL \
	AND nasipaddress = '%{NAS-IP-Address}' \
	AND acctstarttime <= FROM_UNIXTIME(%{integer:Event-Timestamp})"

accounting_start_query = "\
	INSERT INTO ${acct_table1} \
		(acctsessionid, acctuniqueid, username, \
		realm, nasipaddress, nasportid, \
		nasporttype, acctstarttime, acctupdatetime, \
		acctstoptime, acctsessiontime, acctauthentic, \
		connectinfo_start, connectinfo_stop, \
		acctinputoctets, acctoutputoctets, \
		calledstationid, callingstationid, \
		acctterminatecause, servicetype, \
		framedprotocol, framedipaddress) \
	VALUES \
		('%{Acct-Session-Id}', '%{Acct-Unique-Session-Id}', '%{SQL-User-Name}', \
		'%{Realm}', '%{NAS-IP-Address}', '%{NAS-Port-ID}', \
		'%{NAS-Port-Type}', FROM_UNIXTIME(%{integer:Event-Timestamp}), FROM_UNIXTIME(%{integer:Event-Timestamp}), \
		NULL, '0', '%{Acct-Authentic}', \
		'%{Connect-Info}', '', \
		'0', '0', \
		'%{Called-Station-Id}', '%{Calling-Station-Id}', \
		'', '%{Service-Type}', \
		'%{Framed-Protocol}', '%{Framed-IP-Address}')"

accounting_start_query_alt = "\
	UPDATE ${acct_table1} \
	SET \
		acctstarttime = FROM_UNIXTIME(%{integer:Event-Timestamp}), \
		acctupdatetime = FROM_UNIXTIME(%{integer:Event-Timestamp}), \
		connectinfo_start = '%{Connect-Info}' \
	WHERE acctuniqueid = '%{Acct-Unique-Session-Id}'"

accounting_stop_query = "\
	UPDATE ${acct_table1} \
	SET \
		acctstoptime = FROM_UNIXTIME(%{integer:Event-Timestamp}), \
		acctsessiontime = '%{Acct-Session-Time}', \
		acctterminatecause = '%{Acct-Terminate-Cause}', \
		acctinputoctets = '%{Acct-Input-Octets}' + ('%{Acct-Input-Gigawords}' * 4294967296), \
		acctoutputoctets = '%{Acct-Output-Octets}' + ('%{Acct-Output-Gigawords}' * 4294967296), \
		acctupdatetime = FROM_UNIXTIME(%{integer:Event-Timestamp}), \
		connectinfo_stop = '%{Connect-Info}' \
	WHERE acctuniqueid = '%{Acct-Unique-Session-Id}'"

accounting_stop_query_alt = "\
	INSERT INTO ${acct_table2} \
		(acctsessionid, acctuniqueid, username, \
		realm, nasipaddress, nasportid, \
		nasporttype, acctstarttime, acctupdatetime, \
		acctstoptime, acctsessiontime, acctauthentic, \
		connectinfo_start, connectinfo_stop, \
		acctinputoctets, acctoutputoctets, \
		calledstationid, callingstationid, \
		acctterminatecause, servicetype, \
		framedprotocol, framedipaddress) \
	VALUES \
		('%{Acct-Session-Id}', '%{Acct-Unique-Session-Id}', '%{SQL-User-Name}', \
		'%{Realm}', '%{NAS-IP-Address}', '%{NAS-Port-ID}', \
		'%{NAS-Port-Type}', FROM_UNIXTIME(%{integer:Event-Timestamp} - %{Acct-Session-Time|0}), \
		FROM_UNIXTIME(%{integer:Event-Timestamp}), \
		FROM_UNIXTIME(%{integer:Event-Timestamp}), '%{Acct-Session-Time}', '%{Acct-Authentic}', \
		'', '%{Connect-Info}', \
		'%{Acct-Input-Octets}' + ('%{Acct-Input-Gigawords}' * 4294967296), \
		'%{Acct-Output-Octets}' + ('%{Acct-Output-Gigawords}' * 4294967296), \
		'%{Called-Station-Id}', '%{Calling-Station-Id}', \
		'%{Acct-Terminate-Cause}', '%{Service-Type}', \
		'%{Framed-Protocol}', '%{Framed-IP-Address}')"

accounting_update_query = "\
	UPDATE ${acct_table1} \
	SET \
		acctupdatetime = FROM_UNIXTIME(%{integer:Event-Timestamp}), \
		acctinterval = '%{Acct-Interval}', \
		acctsessiontime = '%{Acct-Session-Time}', \
		acctinputoctets = '%{Acct-Input-Octets}' + ('%{Acct-Input-Gigawords}' * 4294967296), \
		acctoutputoctets = '%{Acct-Output-Octets}' + ('%{Acct-Output-Gigawords}' * 4294967296) \
	WHERE acctuniqueid = '%{Acct-Unique-Session-Id}'"

accounting_update_query_alt = "\
	INSERT INTO ${acct_table1} \
		(acctsessionid, acctuniqueid, username, \
		realm, nasipaddress, nasportid, \
		nasporttype, acctstarttime, acctupdatetime, \
		acctstoptime, acctsessiontime, acctauthentic, \
		connectinfo_start, connectinfo_stop, \
		acctinputoctets, acctoutputoctets, \
		calledstationid, callingstationid, \
		acctterminatecause, servicetype, \
		framedprotocol, framedipaddress) \
	VALUES \
		('%{Acct-Session-Id}', '%{Acct-Unique-Session-Id}', '%{SQL-User-Name}', \
		'%{Realm}', '%{NAS-IP-Address}', '%{NAS-Port-ID}', \
		'%{NAS-Port-Type}', FROM_UNIXTIME(%{integer:Event-Timestamp} - %{Acct-Session-Time|0}), \
		FROM_UNIXTIME(%{integer:Event-Timestamp}), \
		NULL, '%{Acct-Session-Time}', '%{Acct-Authentic}', \
		'%{Connect-Info}', '', \
		'%{Acct-Input-Octets}' + ('%{Acct-Input-Gigawords}' * 4294967296), \
		'%{Acct-Output-Octets}' + ('%{Acct-Output-Gigawords}' * 4294967296), \
		'%{Called-Station-Id}', '%{Calling-Station-Id}', \
		'', '%{Service-Type}', \
		'%{Framed-Protocol}', '%{Framed-IP-Address}')"

# Post-auth query - logs all authentication attempts
post_auth_query = "\
	INSERT INTO ${postauth_table} \
		(username, pass, reply, authdate) \
	VALUES \
		('%{User-Name}', \
		'%{%{User-Password}:-%{Chap-Password}}', \
		'%{reply:Packet-Type}', \
		NOW())"

# Client query (reads NAS from database)
client_query = "\
	SELECT id, nasname, shortname, type, ports, \
		secret, server, community, description \
	FROM ${client_table}"
