name: Deploy

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Copy SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to server
        env:
          JWT_SECRET:   ${{ secrets.JWT_SECRET }}
          DB_PASSWORD:  ${{ secrets.DB_PASSWORD }}
          VPN_SERVER:   ${{ secrets.VPN_SERVER }}
          VPN_PSK:      ${{ secrets.VPN_PSK }}
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER_NAME }}@${{ secrets.SSH_SERVER_IP }} \
            "JWT_SECRET='${JWT_SECRET}' DB_PASSWORD='${DB_PASSWORD}' VPN_SERVER='${VPN_SERVER}' VPN_PSK='${VPN_PSK}' bash -s" <<'EOF'

          set -e
          cd /home/rom/diplomavpn

          git remote set-url origin https://github.com/splitedwindow/vpnServer.git
          git fetch origin main
          git reset --hard origin/main

          # Build frontend
          cd frontend
          npm install --legacy-peer-deps
          npm run build
          cd ..
          chmod o+rx /home/rom /home/rom/diplomavpn
          chmod -R o+rx /home/rom/diplomavpn/frontend/dist

          # Write .env from secrets passed via environment
          cat > .env <<ENVEOF
          DB_HOST=mysql
          DB_PORT=3306
          DB_USER=radius
          DB_PASSWORD=${DB_PASSWORD}
          DB_NAME=radius
          PORT=3000
          JWT_SECRET=${JWT_SECRET}
          VPN_SERVER=${VPN_SERVER}
          VPN_NAME=DiplomaVPN
          VPN_PSK=${VPN_PSK}
          ENVEOF

          # Rebuild and restart
          docker compose down
          docker compose up -d --build

          # Wait for MySQL to be ready, then ensure schema exists
          sleep 12
          docker exec -i radius_mysql mysql -u radius -pradiuspassword radius < /home/rom/diplomavpn/mysql/init.sql

          # Verify
          docker compose ps
          echo "Deployment complete!"

          EOF
