name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: vpn-client/package.json

      - name: Install dependencies
        run: npm install
        working-directory: vpn-client

      - name: Build & publish installer
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npm run dist
        working-directory: vpn-client
