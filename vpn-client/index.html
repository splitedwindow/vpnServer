<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'" />
  <title>DiplomaVPN</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0d0d1a;
      color: #fff;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }

    /* ── Title bar ─────────────────────────────── */
    #titlebar {
      height: 36px;
      background: rgba(255,255,255,0.03);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      -webkit-app-region: drag;
    }

    #titlebar .title {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1px;
      color: rgba(255,255,255,0.45);
      text-transform: uppercase;
    }

    #titlebar .controls {
      display: flex;
      gap: 8px;
      -webkit-app-region: no-drag;
    }

    .ctrl-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      cursor: pointer;
      opacity: 0.75;
      transition: opacity 0.15s;
    }
    .ctrl-dot:hover { opacity: 1; }
    .ctrl-dot.yellow { background: #f59e0b; }
    .ctrl-dot.red    { background: #ef4444; }

    /* ── Main layout ────────────────────────────── */
    #app {
      height: calc(100vh - 36px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0 28px 20px;
      gap: 0;
    }

    /* ── Shield ─────────────────────────────────── */
    .shield-wrap {
      position: relative;
      margin-bottom: 22px;
    }

    .shield-glow {
      position: absolute;
      inset: -28px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(108,99,255,0.22) 0%, transparent 72%);
      transition: background 0.8s ease;
      pointer-events: none;
    }

    .shield-glow.connected {
      background: radial-gradient(circle, rgba(16,185,129,0.28) 0%, transparent 72%);
    }

    .shield-glow.connecting {
      animation: glowPulse 1.2s ease-in-out infinite;
    }

    @keyframes glowPulse {
      0%, 100% { opacity: 0.5; }
      50%       { opacity: 1; }
    }

    /* ── App name ────────────────────────────────── */
    h1 {
      font-size: 21px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .server-line {
      font-size: 11px;
      color: rgba(255,255,255,0.3);
      margin-bottom: 28px;
      letter-spacing: 0.3px;
    }

    /* ── Status card ─────────────────────────────── */
    .status-card {
      width: 100%;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 18px;
    }

    .status-indicator {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
      background: #ef4444;
      transition: background 0.4s;
    }

    .status-indicator.connected   { background: #10b981; animation: pulseGreen 2s infinite; }
    .status-indicator.connecting  { background: #f59e0b; animation: blinkAmber 0.7s infinite; }
    .status-indicator.disconnecting { background: #f59e0b; animation: blinkAmber 0.7s infinite; }

    @keyframes pulseGreen {
      0%, 100% { box-shadow: 0 0 0 0   rgba(16,185,129,0.5); }
      50%       { box-shadow: 0 0 0 6px rgba(16,185,129,0);   }
    }
    @keyframes blinkAmber {
      0%, 100% { opacity: 1;   }
      50%       { opacity: 0.3; }
    }

    .status-main {
      font-size: 14px;
      font-weight: 600;
      line-height: 1.3;
    }

    .status-sub {
      font-size: 11px;
      color: rgba(255,255,255,0.38);
      margin-top: 2px;
    }

    /* ── Main button ─────────────────────────────── */
    #mainBtn {
      width: 100%;
      height: 52px;
      border: none;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.4px;
      cursor: pointer;
      transition: all 0.3s ease;
      background: linear-gradient(135deg, #6c63ff 0%, #4f46e5 100%);
      color: #fff;
      margin-bottom: 18px;
    }

    #mainBtn:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(108,99,255,0.45);
    }

    #mainBtn.connected {
      background: linear-gradient(135deg, #059669 0%, #047857 100%);
    }

    #mainBtn.connected:hover:not(:disabled) {
      box-shadow: 0 8px 24px rgba(5,150,105,0.45);
    }

    #mainBtn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    /* ── Log ─────────────────────────────────────── */
    #log {
      width: 100%;
      background: rgba(255,255,255,0.03);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 11px;
      color: rgba(255,255,255,0.38);
      line-height: 1.65;
      min-height: 58px;
      max-height: 88px;
      overflow-y: auto;
    }

    #log::-webkit-scrollbar { width: 4px; }
    #log::-webkit-scrollbar-track { background: transparent; }
    #log::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 2px; }

    .log-row { display: flex; gap: 6px; }
    .log-time { color: rgba(255,255,255,0.18); flex-shrink: 0; }
    .log-msg  { flex: 1; word-break: break-word; }
    .log-err  { color: #f87171; }
  </style>
</head>
<body>

  <!-- Title bar -->
  <div id="titlebar">
    <span class="title">DiplomaVPN</span>
    <div class="controls">
      <div class="ctrl-dot yellow" id="btnMin"  title="Minimize"></div>
      <div class="ctrl-dot red"    id="btnClose" title="Close"></div>
    </div>
  </div>

  <!-- App body -->
  <div id="app">

    <!-- Shield icon -->
    <div class="shield-wrap">
      <div class="shield-glow" id="shieldGlow"></div>
      <svg width="88" height="88" viewBox="0 0 88 88" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="gDisc" x1="0" y1="0" x2="88" y2="88" gradientUnits="userSpaceOnUse">
            <stop offset="0%"   stop-color="#6c63ff"/>
            <stop offset="100%" stop-color="#4f46e5"/>
          </linearGradient>
          <linearGradient id="gConn" x1="0" y1="0" x2="88" y2="88" gradientUnits="userSpaceOnUse">
            <stop offset="0%"   stop-color="#10b981"/>
            <stop offset="100%" stop-color="#047857"/>
          </linearGradient>
        </defs>
        <path id="shieldFill"
          d="M44 7L13 20V43C13 60.5 26.5 76 44 81C61.5 76 75 60.5 75 43V20L44 7Z"
          fill="url(#gDisc)" opacity="0.92"/>
        <!-- Lock icon (shown when disconnected) -->
        <g id="iconLock">
          <rect x="32" y="42" width="24" height="16" rx="3" fill="none" stroke="white" stroke-width="2.5"/>
          <path d="M38 42v-5a6 6 0 0 1 12 0v5" stroke="white" stroke-width="2.5" stroke-linecap="round" fill="none"/>
        </g>
        <!-- Check icon (shown when connected) -->
        <g id="iconCheck" opacity="0">
          <path d="M30 44l10 10 18-18" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        </g>
      </svg>
    </div>

    <h1>DiplomaVPN</h1>
    <p class="server-line">94.231.178.181 &nbsp;·&nbsp; L2TP/IPSec</p>

    <!-- Status card -->
    <div class="status-card">
      <div class="status-indicator" id="statusDot"></div>
      <div class="status-texts">
        <div class="status-main" id="statusMain">Disconnected</div>
        <div class="status-sub"  id="statusSub">Click Connect to start</div>
      </div>
    </div>

    <!-- Action button -->
    <button id="mainBtn">Connect</button>

    <!-- Log -->
    <div id="log"></div>

  </div>

  <script src="renderer.js"></script>
</body>
</html>
